<div class="absolute flex justify-end right-5 top-14">
  <div class="flex">
    <button
      (click)="addItem()"
      type="button"
      class="px-2 py-1 outline-1 text-xs font-medium text-center inline-flex items-center border-red-500 text-red-500 border rounded-full"
    >
      <mat-icon class="text-xs font-medium">add</mat-icon>
      Add New Client
    </button>
  </div>
</div>
<div class="career-wrapper system-bg pr-3">
  <div class="grid grid-cols-1 gap-3">
    <ng-container *ngFor="let item of item_list; let i = index">
      <div class="relative p-3 border rounded bg-white">
        <span class="absolute top-1 right-1">
          <app-menu
            [modalItem]="item"
            (initModal)="addItem($event)"
            [delete]="item"
            (deleteItem)="deleteItem($event)"
          ></app-menu>
        </span>
        <div class="flex">
          <div class="w-1/6">
            <img
              class="object-fit h-28 rounded-md"
              [src]="Global.BACKEND_URL + item?.file_path"
              alt="Image"
            />
          </div>
          <div class="w-5/6 pl-3">
            <div class="flex flex-col">
              <div class="text-lg font-base leading-5">
                {{ item?.client_name }}
              </div>
              <div class="text-md font-base text-red-500 leading-5">
                {{ item?.designation }}, {{ item?.company_name }}
              </div>
              <div class="text-sm font-normal text-gray-400 leading-5 mt-1">
                <span [innerHTML]="item?.description"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
  <ng-container *ngIf="!item_list?.length">
    <div class="h-[85%] flex justify-center items-center">
      <span>No Items Found</span>
    </div>
  </ng-container>
</div>
<ng-container *ngIf="item_list?.length">
  <pagination
    [pagination]="paginationOption"
    (pageChange)="onPageChange($event)"
  ></pagination>
</ng-container>
