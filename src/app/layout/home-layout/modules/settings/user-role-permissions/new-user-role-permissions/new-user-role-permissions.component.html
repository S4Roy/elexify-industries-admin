<div class="fixed inset-0 overflow-hidden">
  <div class="absolute inset-0 overflow-hidden">
    <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
      <div class="pointer-events-auto relative w-screen max-w-md">
        <div class="flex h-full flex-col overflow-y-scroll bg-white shadow-xl">
          <div class="p-1 add-new-title sm:px-6">
            <h2 class="flex  mb-0 justify-between items-center font-semibold text-white" id="slide-over-title">
              Add New Role
              <button color="warn" mat-dialog-close mat-icon-button>
                <mat-icon class="text-red-700">close</mat-icon>
              </button>
            </h2>
          </div>
          <div class="relative my-3 flex-1 px-4 sm:px-6">
            <form class="space-y-6" [formGroup]="addNewRoleForm">
              <div>
                <label class="block text-sm/6 font-medium text-gray-900">Role name
                  <span class="text-red-500" *ngIf="
                        Global.isInputRuleAvailable(
                          addNewRoleForm,
                          'role',
                          'required'
                        )
                      ">*</span>
                </label>
                <div class="mt-2">
                  <mat-form-field>
                    <input formControlName="role" matInput [class.is-invalid]="
                          !Global.isInputValid(addNewRoleForm, 'role')
                        " placeholder="Type Here" />
                    <mat-error *ngIf="
                          !Global.isInputRuleValid(addNewRoleForm, 'role', 'required')
                        ">
                      This field is required
                    </mat-error>
                  </mat-form-field>
                </div>
                <div class="">
                  <label class="block text-sm/6 font-medium text-gray-900 my-3">
                    <h2>Permissions</h2>
                  </label>
                </div>
                <div class="mt-2">
                  <div> <h5>Service Management</h5> </div>
                  <ng-container *ngFor="let section of section_list">
                    <mat-checkbox [value]="section.id">{{ section?.name }}</mat-checkbox>
                  </ng-container>
                  <div> <h5>Pages</h5> </div>
                  <ng-container *ngFor="let section of section_list">
                    <mat-checkbox [value]="section.id">{{ section?.name }}</mat-checkbox>
                  </ng-container>
                  <div> <h5>Media Management</h5> </div>
                  <ng-container *ngFor="let section of section_list">
                    <mat-checkbox [value]="section.id">{{ section?.name }}</mat-checkbox>
                  </ng-container>
                  <div> <h5>Contact Management</h5> </div>
                  <ng-container *ngFor="let section of section_list">
                    <mat-checkbox [value]="section.id">{{ section?.name }}</mat-checkbox>
                  </ng-container>
                </div>
              </div>
            </form>
          </div>
          <button (click)="submitLogin()" [disabled]="addNewRoleForm.disabled" class="save-button">
            {{ addNewRoleForm.disabled ? "Please wait..." : "Save & Continue" }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
