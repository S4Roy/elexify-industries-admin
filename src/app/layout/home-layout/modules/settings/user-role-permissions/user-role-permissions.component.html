<div class="relative overflow-x-auto">
    <div class="m-3 flex justify-between items-center">
      <div class="flex flex-col items-start">
        <span class="text-base font-medium">Roles & Permissions</span>
        <span class="block text-gray-500 text-xs">{{paginationOption.total_records}} Roles added</span>
      </div>
    </div>
    <hr />
    <div class="m-3">
      <div class="table-wrapper">
        <table
          class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400"
        >
          <thead class="text-xs text-gray-700 uppercase bg-gray-50">
            <tr class="sticky">
              <th scope="col">Role Name</th>
              <th scope="col" class="text-center">Number Of Users</th>
              <!-- <th scope="col">Module & Permission</th> -->
              <!-- <th scope="col" class="text-center">Action</th> -->
            </tr>
          </thead>
          <tbody>
            <ng-container *ngFor="let item of item_list">
              <tr>
                <td
                  scope="row"
                  class="font-medium text-gray-900 whitespace-nowrap"
                >
                  {{ item?.role_display_name }}
                </td>
                <td class="text-center">{{ item?.user_count }}</td>
                <!-- <td class="text-center">{{ item?.status }}</td> -->
                <!-- <td class="text-center">
                  <app-menu
                    [modalItem]="item"
                    (initModal)="addItem($event)"
                  ></app-menu>
                </td> -->
              </tr>
            </ng-container>
            <ng-container *ngIf="!item_list?.length">
              <tr>
                <td class="text-center" colspan="2">No Items Found</td>
              </tr>
            </ng-container>
          </tbody>
        </table>
      </div>
      <ng-container>
        <pagination
          [pagination]="paginationOption"
          (pageChange)="onPageChange($event)"
        ></pagination>
      </ng-container>
    </div>
</div>
