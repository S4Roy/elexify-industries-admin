<div class="fixed inset-0 overflow-hidden">
  <div class="absolute inset-0 overflow-hidden">
    <div
      class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10"
    >
      <div class="pointer-events-auto relative w-screen max-w-md">
        <div class="flex h-full flex-col overflow-y-scroll bg-white shadow-xl">
          <div class="p-1 add-new-title sm:px-6">
            <h2
              class="flex mb-0 justify-between items-center font-semibold text-white"
              id="slide-over-title"
            >
              {{ data ? "Update" : "Add New" }} Credentials
              <button color="warn" mat-dialog-close mat-icon-button>
                <mat-icon class="text-red-700">close</mat-icon>
              </button>
            </h2>
          </div>
          <div class="relative my-3 flex-1 px-4 sm:px-6">
            <form class="space-y-1" [formGroup]="formGroup">
              <div>
                <label class="block text-sm/6 font-medium text-gray-900"
                  >Category
                  <span
                    class="text-red-500"
                    *ngIf="
                      Global.isInputRuleAvailable(
                        formGroup,
                        'category_id',
                        'required'
                      )
                    "
                  >
                    *</span
                  >
                </label>
                <div class="mt-2">
                  <mat-form-field>
                    <mat-select
                      placeholder="Select"
                      formControlName="category_id"
                      required
                    >
                      <ng-container *ngFor="let item of category_list">
                        <mat-option [value]="item?.id">{{
                          item?.category_name
                        }}</mat-option>
                      </ng-container>
                    </mat-select>
                    <!-- formControlName="category_id"
                        matInput
                        [class.is-invalid]="
                          !Global.isInputValid(formGroup, 'category_id')
                        "
                        placeholder="Add Your Category"
                      /> -->
                    <mat-error
                      *ngIf="
                        !Global.isInputRuleValid(
                          formGroup,
                          'category_id',
                          'required'
                        )
                      "
                    >
                      This field is required
                    </mat-error>
                  </mat-form-field>
                </div>
              </div>

              <div>
                <label class="block text-sm/6 font-medium text-gray-900"
                  >Title
                  <span
                    class="text-red-500"
                    *ngIf="
                      Global.isInputRuleAvailable(
                        formGroup,
                        'title',
                        'required'
                      )
                    "
                  >
                    *</span
                  >
                </label>
                <div class="mt-2">
                  <mat-form-field appearance="fill">
                    <textarea
                      matInput
                      formControlName="title"
                      placeholder="Type Here"
                    ></textarea>
                    <mat-error
                      *ngIf="
                        !Global.isInputRuleValid(formGroup, 'title', 'required')
                      "
                    >
                      This field is required
                    </mat-error>
                  </mat-form-field>
                </div>
              </div>
              <div class="mt-2">
                <label class="block text-sm/6 font-medium text-gray-900"
                  >Status
                  <span
                    class="text-red-500"
                    *ngIf="
                      Global.isInputRuleAvailable(
                        formGroup,
                        'status',
                        'required'
                      )
                    "
                  >
                    *</span
                  >
                </label>
                <mat-form-field class="mt-2">
                  <mat-select
                    placeholder="Select"
                    formControlName="status"
                    matInput
                    [class.is-invalid]="
                      !Global.isInputValid(formGroup, 'status')
                    "
                  >
                    <mat-option value="active">Active</mat-option>
                    <mat-option value="inactive">Inactive</mat-option>
                  </mat-select>
                  <mat-error
                    *ngIf="
                      !Global.isInputRuleValid(formGroup, 'status', 'required')
                    "
                  >
                    This field is required
                  </mat-error>
                </mat-form-field>
              </div>
              <div class="h-30">
                <div
                  class="w-full h-full rounded flex items-center justify-center relative"
                >
                  <span
                    *ngIf="formGroup.value.file_preview"
                    class="absolute right-2 top-2"
                  >
                    <app-menu
                      [modalItem]="true"
                      (initModal)="mediaFile.click()"
                    ></app-menu>
                  </span>
                  <ng-container *ngIf="formGroup.value.file_preview">
                    <div class="bg-blue-300 p-2 w-full h-10 flex justify-center items-center">File Selected</div>
                  </ng-container>
                  <ng-container *ngIf="!formGroup.value.file_preview">
                    <div
                      class="flex flex-col items-center justify-center cursor-pointer"
                      (click)="mediaFile.click()"
                    >
                      <img src="assets/placeholder-image-outline.png" alt="" />
                      <div>Choose Credential File</div>
                      <div class="text-center text-red-600 font-normal italic">
                        Maximum file size is 5 MB
                      </div>
                    </div>
                  </ng-container>
                </div>
                <input
                  type="file"
                  #mediaFile
                  hidden
                  (change)="
                    Global.onFileSelected(
                      formGroup,
                      $event,
                      'file',
                      toastr,
                      ['application/pdf'],
                      'file_preview'
                    )
                  "
                />
              </div>
            </form>
          </div>
          <button
            (click)="onSubmit()"
            [disabled]="formGroup.disabled"
            class="save-button"
          >
            {{ formGroup.disabled ? "Please wait..." : "Save & Continue" }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
