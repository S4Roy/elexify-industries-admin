<div class="relative overflow-x-auto">
  <div class="m-3 flex justify-between items-center">
    <div class="flex flex-col items-start">
      <span class="text-base font-medium">Credentials List</span>
      <span class="block text-gray-500 text-xs"
        >{{ paginationOption.total_records }} credentials added</span
      >
    </div>
    <button
      *ngIf="permissions.includes('add')"
      (click)="addItem({ faq_category_id: filterOption.list_type })"
      class="ai-button"
    >
      + Add New
    </button>
  </div>
  <hr />
  <div class="m-3">
    <ul
      *ngIf="category_list?.length"
      class="flex flex-wrap text-sm font-medium text-center text-gray-500"
    >
      <li class="me-1">
        <a
          href="javascript:void(0)"
          (click)="onlistTypeChange({ id: '' })"
          aria-current="page"
          [class]="filterOption.list_type == '' ? ' active' : ''"
          class="inline-block p-2 rounded-t-lg"
          >All</a
        >
      </li>
      <li class="me-2" *ngFor="let item of category_list">
        <a
          (click)="onlistTypeChange(item)"
          href="javascript:void(0)"
          [class]="filterOption.list_type == item.id ? 'active' : ''"
          class="inline-block p-2 rounded-t-lg hover:text-gray-600 hover:bg-gray-50"
          >{{ item?.category_name }}</a
        >
      </li>
    </ul>
    <div class="tab-content-wrapper py-2">
      <ng-container *ngFor="let item of item_list; let i = index">
        <div class="flex flex-col mb-3">
          <div
            class="flex justify-between rounded-lg items-center bg-gray-100 p-2"
          >
            <span>
              <a
                target="_blank"
                [href]="Global.BACKEND_URL + item?.file_path"
                class="text-blue-600 text-sm me-1"
              >
                {{ item?.title }}</a
              ></span
            >
            <span class="flex justify-end">
              <span class="mx-2">
                {{ item?.status }}
              </span>
              <app-menu
                [modalItem]="permissions.includes('edit') ? item : null"
                (initModal)="addItem($event)"
                (deleteItem)="deleteItem($event)"
                [delete]="permissions.includes('delete') ? item : null"
              ></app-menu>
            </span>
          </div>
        </div>
      </ng-container>
      <ng-container *ngIf="!item_list?.length">
        <div class="flex flex-col mb-3">
          <div class="m-2">No Items Found</div>
        </div>
      </ng-container>
    </div>
    <ng-container>
      <pagination
        [pagination]="paginationOption"
        (pageChange)="onPageChange($event)"
      ></pagination>
    </ng-container>
  </div>
</div>
