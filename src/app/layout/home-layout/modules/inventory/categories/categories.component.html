<div class="relative overflow-x-auto">
  <div class="m-3 flex justify-between items-center">
    <div class="flex flex-col items-start">
      <span class="text-base font-medium">Category List</span>
      <span
        *ngIf="paginationOption.totalDocs"
        class="block text-gray-500 text-xs"
        >{{ paginationOption.totalDocs }} categorie{{
          paginationOption.totalDocs > 1 ? "s" : ""
        }}
        added</span
      >
    </div>
    <button
      *ngIf="permissions.includes('add')"
      (click)="addItem()"
      class="ai-button"
    >
      + Add New
    </button>
  </div>
  <hr />
  <div class="m-3">
    <div class="table-wrapper">
      <table class="table-base">
        <thead>
          <tr class="sticky">
            <th scope="col"></th>
            <th scope="col">Name</th>
            <th scope="col">Products</th>
            <th scope="col" class="text-center">Status</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let item of item_list">
            <tr>
              <td>
                <img
                  *ngIf="item?.image?.url"
                  [src]="item?.image?.url"
                  alt="Image"
                />
              </td>
              <td class="">
                <a [routerLink]="'/inventory/categories/' + item?.slug">{{
                  item?.name
                }}</a>
              </td>
              <td>
                <a [routerLink]="'/inventory/products/' + item?.slug">{{
                  item?.products
                    ? item.products +
                      " Product" +
                      (item.products > 1 ? "s" : "")
                    : ""
                }}</a>
              </td>
              <td class="text-center">
                <span class="table-status" [class]="item?.status">
                  {{ item?.status }}
                </span>
              </td>
              <td class="text-center">
                <app-menu
                  [modalItem]="permissions.includes('edit') ? item : null"
                  (initModal)="addItem($event)"
                  (deleteItem)="deleteItem($event)"
                  [delete]="permissions.includes('delete') ? item : null"
                ></app-menu>
              </td>
            </tr>
          </ng-container>
          <ng-container *ngIf="!item_list?.length">
            <tr>
              <td class="text-center" colspan="5">No Items Found</td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
    <ng-container>
      <pagination
        [pagination]="paginationOption"
        (pageChange)="onPageChange($event)"
      ></pagination>
    </ng-container>
  </div>
</div>
