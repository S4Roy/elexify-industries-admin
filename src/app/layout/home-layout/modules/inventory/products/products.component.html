<div class="relative overflow-x-auto">
  <div class="m-3 flex justify-between items-center">
    <div class="flex flex-col items-start">
      <span class="text-base font-medium">Product List</span>
      <span
        *ngIf="paginationOption.totalDocs"
        class="block text-gray-500 text-xs"
        >{{ paginationOption.totalDocs }} product{{
          paginationOption.totalDocs > 1 ? "s" : ""
        }}
        added</span
      >
    </div>
    <button
      *ngIf="permissions.includes('add')"
      (click)="addItem()"
      class="ai-button"
    >
      + Add New
    </button>
  </div>
  <hr />
  <div class="m-3">
    <div class="table-wrapper">
      <table class="table-base">
        <thead>
          <tr class="sticky">
            <th scope="col"></th>
            <th scope="col">Brand</th>
            <th scope="col">Category</th>
            <th scope="col">Name</th>
            <th scope="col">Stock</th>
            <th scope="col" class="text-center">Status</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let item of item_list">
            <tr>
              <td>
                <img
                  *ngIf="item?.images?.length"
                  [src]="item?.images[0]?.url"
                  alt="Image"
                />
              </td>
              <td class="">
                <a>{{ item?.brand?.name }}</a>
              </td>
              <td class="">
                <ng-container *ngFor="let category of item?.categories">
                  <a
                    class="block"
                    [routerLink]="'/inventory/products/' + category?.slug"
                    >{{ category?.name }}</a
                  >
                </ng-container>
              </td>
              <td class="">
                <a [routerLink]="'/inventory/products/details/' + item?.slug">{{
                  item?.name
                }}</a>
              </td>
              <td>
                <a class="cursor-pointer" (click)="stockItem(item)">{{
                  item?.current_stock
                }}</a>
              </td>
              <td class="text-center">
                <span class="table-status" [class]="item?.status">
                  {{ item?.status }}
                </span>
              </td>
              <td class="text-center">
                <app-menu
                  [modalItem]="permissions.includes('edit') ? item : null"
                  [stockItem]="permissions.includes('edit') ? item : null"
                  (initModal)="addItem($event)"
                  (initStockModal)="stockItem($event)"
                  (deleteItem)="deleteItem($event)"
                  [delete]="permissions.includes('delete') ? item : null"
                ></app-menu>
              </td>
            </tr>
          </ng-container>
          <ng-container *ngIf="!item_list?.length">
            <tr>
              <td class="text-center" colspan="5">No Items Found</td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
    <ng-container>
      <pagination
        [pagination]="paginationOption"
        (pageChange)="onPageChange($event)"
      ></pagination>
    </ng-container>
  </div>
</div>
