<div class="relative overflow-x-auto">
  <div class="m-3 flex justify-between items-center">
    <div class="flex flex-col items-start">
      <span class="text-base font-medium">Order List</span>
      <span
        *ngIf="paginationOption.totalDocs"
        class="block text-gray-500 text-xs"
        >{{ paginationOption.totalDocs }} order{{
          paginationOption.totalDocs > 1 ? "s" : ""
        }}
        added</span
      >
    </div>
    <!-- <button
      *ngIf="permissions.includes('add')"
      (click)="addItem()"
      class="ai-button"
    >
      + Add New
    </button> -->
  </div>
  <hr />
  <div class="m-3">
    <div class="table-wrapper">
      <table class="table-base">
        <thead>
          <tr class="sticky">
            <th scope="col">ID</th>
            <th scope="col">Customer</th>
            <th scope="col">Date</th>
            <th scope="col">Status</th>
            <th scope="col">Total</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let item of item_list">
            <tr>
              <td (click)="orderDetails(item)">
                <a href="javascript:void(0)">{{ item?.id }}</a>
              </td>
              <td class="">
                <a>{{ item?.user?.name }}</a>
              </td>
              <td class="">
                {{ item?.created_at | date }}
              </td>
              <td class="">
                {{ item?.order_status }}
              </td>

              <td (click)="orderDetails(item)">
                {{ item?.grand_total }}
              </td>

              <td class="text-center">
                <!-- <app-menu
                  [modalItem]="permissions.includes('edit') ? item : null"
                  [stockItem]="permissions.includes('edit') ? item : null"
                  (initModal)="addItem($event)"
                  (initStockModal)="stockItem($event)"
                  (deleteItem)="deleteItem($event)"
                  [delete]="permissions.includes('delete') ? item : null"
                ></app-menu> -->
              </td>
            </tr>
          </ng-container>
          <ng-container *ngIf="!item_list?.length">
            <tr>
              <td class="text-center" colspan="7">No Items Found</td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
    <ng-container>
      <pagination
        [pagination]="paginationOption"
        (pageChange)="onPageChange($event)"
      ></pagination>
    </ng-container>
  </div>
</div>
