<div class="flex flex-col lg:flex-row p-3 gap-6 bg-gray-100">
  <!-- Left: Order Summary -->
  <div class="w-full lg:w-1/3 bg-white rounded-2xl shadow p-5 space-y-4">
    <div class="text-xl font-semibold text-blue-600">Order #{{ data?.id }}</div>

    <div class="text-sm space-y-1">
      <p>
        <span class="font-medium">Customer:</span>
        <a href="#" class="text-blue-500 hover:underline">{{
          data?.user?.name
        }}</a>
      </p>
      <p>
        <span class="font-medium">Status:</span>
        <span class="status-label {{ data?.order_status }}">{{
          data?.order_status
        }}</span>
      </p>
      <p>
        <span class="font-medium">Date:</span>
        {{ data?.created_at | date : "medium" }}
      </p>
      <p>
        <span class="font-medium">Products:</span>
        {{ data?.order_items?.length }}
      </p>
      <p>
        <span class="font-medium">Total:</span>
        {{ data?.grand_total | currency : "INR" }}
      </p>
    </div>

    <div>
      <label class="text-sm font-medium block mb-1">Order Notes:</label>
      <textarea class="w-full border rounded p-2 text-sm h-24"></textarea>
    </div>

    <div>
      <label class="text-sm font-medium block mb-1">Packing Slip Note:</label>
      <textarea
        class="w-full border rounded p-2 text-sm h-24"
        readonly
      ></textarea>
    </div>

    <div class="flex items-center justify-between pt-2">
      <div class="text-sm text-gray-700">
        <span class="font-medium">Picked:</span>
        {{ data?.picked_quantity }} / {{ data?.ordered_quantity }}
      </div>
      <button
        (click)="packItem()"
        [disabled]="data?.picked_quantity < data?.ordered_quantity"
        class="text-xs bg-blue-500 text-white px-4 py-1.5 rounded hover:bg-blue-600 disabled:opacity-50"
      >
        Pack Item
      </button>
    </div>
  </div>

  <!-- Right: Pick List -->
  <div class="w-full lg:w-2/3 bg-white rounded-2xl shadow space-y-6">
    <router-outlet></router-outlet>
  </div>
</div>
