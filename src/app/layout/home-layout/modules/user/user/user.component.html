<div class="relative overflow-x-auto">
  <div class="m-3 flex justify-between items-center">
    <div class="flex flex-col items-start">
      <span class="text-base font-medium">User Lists</span>
      <span class="block text-gray-500 text-xs"
        >{{ paginationOption.total_records }} User added</span
      >
    </div>
    <button *ngIf="permissions.includes('add')" (click)="addItem()" class="ai-button">+ Add New</button>
  </div>
  <hr />
  <div class="m-3">
    <div class="table-wrapper">
      <table
        class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400"
      >
        <thead class="text-xs text-gray-700 uppercase bg-gray-50">
          <tr class="sticky">
            <th scope="col">User Name</th>
            <th scope="col">Role</th>
            <th scope="col">Email ID</th>
            <th scope="col" class="text-center">Permission</th>
            <th scope="col" class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let item of item_list">
            <tr>
              <td
                scope="row"
                class="font-medium text-gray-900 whitespace-nowrap"
              >
                {{ item?.first_name + " " + item?.last_name }}
              </td>
              <td>{{ Global.humanize(item?.role) }}</td>
              <td>{{ item?.email }}</td>
              <td class="text-center">
                <a
                  href="javascript:void(0)"
                  class="bg-green-100 text-green-500 text-xs font-medium inline-flex items-center px-2.5 py-0.5 rounded-full border border-green-600 me-2"
                  (click)="updateRolePermission(item)"
                  >Permissions</a
                >
              </td>
              <td class="text-center">
                <app-menu
                  [modalItem]="permissions.includes('edit') ? item : null"
                  (initModal)="addItem($event)"
                  (deleteItem)="deleteItem($event)"
                  [delete]="permissions.includes('delete') ? item : null"
                ></app-menu>
              </td>
            </tr>
          </ng-container>
          <ng-container *ngIf="!item_list?.length">
            <tr>
              <td class="text-center" colspan="4">No Items Found</td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>

    <ng-container>
      <pagination
        [pagination]="paginationOption"
        (pageChange)="onPageChange($event)"
      ></pagination>
    </ng-container>
  </div>
</div>
<router-outlet></router-outlet>
