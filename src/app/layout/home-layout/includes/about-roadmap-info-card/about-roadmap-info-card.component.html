<div class="flex gap-3">
    <div class="w-3/5 bg-white p-3 rounded">
        <form class="space-y-6" [formGroup]="formGroup">
            <div
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 text-area-sec">
                <ngx-editor-menu [editor]="editor"> </ngx-editor-menu>
                <div class="inner-height">
                    <ngx-editor [editor]="editor" [placeholder]="'Add content'"></ngx-editor>
                </div>
            </div>

            <div class="">
                <input formControlName="email" type="text" [placeholder]="'Add quote subject'"
                    class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
            </div>
            <div class="">
                <textarea formControlName="password" [placeholder]="'Add quote'"
        class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
        rows="4"></textarea>
            </div>
        </form>
    </div>
    <div class="w-2/5 grow "> 
        <app-thumbnail [isFirstCondition]="isFirstCondition"></app-thumbnail>
    </div>
    <div class="w-2/5 grow ">
        <app-thumbnail [isFirstCondition]="!isFirstCondition"></app-thumbnail>
    </div>
</div>
