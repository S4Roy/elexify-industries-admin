<!-- <p>new-hero-section works!</p> -->
<div class="fixed inset-0 overflow-hidden">
    <div class="absolute inset-0 overflow-hidden">
        <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
            <div class="pointer-events-auto relative w-screen max-w-md">
                <div class="flex h-full flex-col overflow-y-scroll bg-white shadow-xl">
                    <div class="p-1 add-new-title sm:px-6">
                        <h2 class="flex justify-between items-center font-semibold text-white" id="slide-over-title">
                            Hero Information
                            <button color="warn" mat-dialog-close mat-icon-button>
                                <mat-icon class="text-red-700">close</mat-icon>
                            </button>
                        </h2>
                    </div>
                    <div class="relative  my-3 flex-1 px-4 sm:px-6">
                        <form class="space-y-6" [formGroup]="homeHeroSecForm">
                            <div>
                                <!-- <label class="block text-sm/6 font-medium text-gray-900">Partner name</label> -->
                                <div class="mt-2">
                                    <div>
                                        <input formControlName="hero_sec_main_heading" type="text"
                                        [placeholder]="'Add heading here'"
                                        class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
                                    </div>
                                    <!-- <div>
                                        <mat-error *ngIf="heroSecForm.get('hero_sec_main_heading').hasError('required')">
                                            Heading is required
                                        </mat-error>
                                    </div> -->
                                    
                                </div>
                                <div class="mt-2">
                                    <input formControlName="hero_sec_sub_heading" type="text"
                                        [placeholder]="'Add sub heading here'"
                                        class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
                                </div>
                            </div>
                            <div class="border relative">
                                <div class="w-full bg-white p-5 h-full rounded flex items-center justify-center">
                                    <div class="flex flex-col items-center justify-center">
                                        <span class="absolute top-0 right-0" *ngIf="imagePreview || videoPreview">
                                            <app-menu  [delete]="'gg'"
                                                (deleteItem)="deleteItem($event)"></app-menu>
                                        </span>
                                        <ng-container *ngIf="!imagePreview && !videoPreview">
                                            <label class="flex flex-col items-center justify-center">
                                                <img src="assets/placeholder-image-outline.png" alt="Upload Image" />
                                                <div>Upload Image Here</div>
                                                <div *ngIf="hasError"
                                                    class="text-center text-red-600 font-normal italic">
                                                    Minimum size required: 1920 width x 640 height
                                                </div>
                                                <input id="chooseFile" hidden type="file" class="d-none"
                                                    (change)="onFileSelected($event)" accept="video/*,image/*" />
                                            </label>
                                        </ng-container>
                                        <div *ngIf="imagePreview" class="mt-3">
                                            <img [src]="imagePreview" alt="Image Preview" class="preview-image" />
                                        </div>
                                        <div *ngIf="videoPreview" class="mt-3">
                                            <video [src]="videoPreview" controls>
                                                Your browser does not support the video tag.
                                            </video>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div>
                        <button (click)="submitHeroSecData()" [disabled]="homeHeroSecForm.disabled"
                            class="flex border w-full justify-center px-3 py-3 text-green-500">
                            {{ homeHeroSecForm.disabled ? "Please wait..." : (data ? "Update & Continue" : "Save &
                            Continue") }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
