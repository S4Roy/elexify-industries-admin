<div>
  <form [formGroup]="formGroup">
    <div class="w-[100%] bg-white p-3 rounded space-y-6">
      <div class="">
        <ng-select
          [class.is-invalid]="!Global.isInputValid(formGroup, 'blogs')"
          bindLabel="blog_title"
          formControlName="blogs"
          bindValue="id"
          (change)="onBlogsChange($event)"
          [items]="blogList"
          [placeholder]="'Select Blogs (up to 3)'"
          [multiple]="true"
        >
        </ng-select>
        <div *ngIf="confirmationMessage" class="text-red-500 mt-2">
          <b>{{ confirmationMessage }}</b>
        </div>
      </div>
      <div class="mb-3"></div>

      <div class="flex justify-end gap-2">
        <div>
          <button
            class="ai-button"
            (click)="onSubmit()"
            [disabled]="formGroup.disabled"
          >
            {{
              formGroup.disabled
                ? "Please wait..."
                : formGroup.value.id
                ? "Update"
                : "Save"
            }}
          </button>
        </div>
        <!-- <div>
                        <button class="ai-button"> Cancel</button>
                    </div> -->
      </div>
    </div>
  </form>
</div>
