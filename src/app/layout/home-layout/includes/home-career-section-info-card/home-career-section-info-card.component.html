<div>
    <form [formGroup]="formGroup">
        <div class="w-[100%] bg-white p-3 rounded space-y-6">
            <div class="">
                <input type="text" formControlName="title" [placeholder]="'Heading*'"
                    class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
                <div *ngIf="isSubmitted && title?.errors?.['required']" class="text-red-500">
                    <b> Heading is required* </b>
                </div>
                <div *ngIf="isSubmitted && title?.errors?.['maxlength']" class="text-red-500">
                    <b>Maximum {{ maxLength1 }} characters allowed.</b>
                </div>
                <!-- <div class="text-gray-500">
                    <div>Text limit: {{ maxLength1 }} characters. Please enter your text within
                        this limit.</div>
                    {{ title?.value.length }} - {{ maxLength1 }} characters
                </div> -->
            </div>
            <div class="">
                <textarea formControlName="description" [placeholder]="'Description*'"
                    class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                </textarea>
                <div *ngIf="isSubmitted && description?.errors?.['required']" class="text-red-500">
                    <b> Description is required* </b>
                </div>
                <div *ngIf="isSubmitted && description?.errors?.['maxlength']" class="text-red-500">
                    <b>Maximum {{ maxLength2 }} characters allowed.</b>
                </div>
                <!-- <div class="text-gray-500">
                    <div>Text limit: {{ maxLength2 }} characters. Please enter your text within
                        this limit.</div>
                    {{ description?.value.length }} - {{ maxLength2 }} characters
                </div> -->
            </div>

        </div>
        <div class="flex p-3 gap-3">
            <div class="w-full border bg-white p-5 h-full rounded flex items-center justify-center">
                <div class="flex flex-col items-center justify-center relative">
                    <span class="absolute top-0 right-0" *ngIf="imagePreview">
                        <app-menu [delete]="'gg'" (deleteItem)="deleteItem1($event)"></app-menu>
                    </span>
                    <ng-container *ngIf="!imagePreview">
                        <label class="flex flex-col items-center justify-center">
                            <img src="assets/placeholder-image-outline.png" alt="Upload Image" />
                            <div *ngIf="!isSubmitted || !hasError " class="text-center text-red-600 font-normal italic">
                                <!-- <div style="color: red;">Upload Image For Certificates</div> -->
                                <div style="color: red;">Upload files in .png, .jpg, .jpeg formats only</div>
                            </div>

                            <div *ngIf="isSubmitted || hasError" class="text-center text-red-600 font-normal italic">
                                <div *ngIf="hasError"><b>{{errorMessage1}}</b></div>

                            </div>
                            <input hidden type="file" class="d-none" (change)="onFileSelected($event)"
                                accept="image/*" />
                        </label>
                    </ng-container>
                    <div *ngIf="imagePreview" class="mt-3">
                        <img [src]="imagePreview" alt="Image Preview" class="preview-image" />
                    </div>
                </div>
            </div>
            <div class="w-full border bg-white p-5 h-full rounded flex items-center justify-center">
                <div class="flex flex-col items-center justify-center relative">
                    <span class="absolute top-0 right-0" *ngIf="imagePreview2">
                        <app-menu [delete]="'gg'" (deleteItem)="deleteItem2($event)"></app-menu>
                    </span>
                    <ng-container *ngIf="!imagePreview2">
                        <label class="flex flex-col items-center justify-center">
                            <img src="assets/placeholder-image-outline.png" alt="Upload Image" />
                            <!-- <div style="text-align: left;">Upload Image For Certificates</div> -->

                            <div class="text-center text-red-600 font-normal italic">
                                <!-- <div style="color: red;">Upload Image For Certificates</div> -->
                                <div style="color: red;">Upload files in .png, .jpg, .jpeg formats only</div>
                            </div>

                            <div *ngIf=" hasError" class="text-center text-red-600 font-normal italic">
                                <div *ngIf="hasError"><b>{{errorMessage1}}</b></div>

                            </div>
                            <input hidden type="file" class="d-none" (change)="onFileSelectedCertificate($event)"
                                accept="image/*" />
                        </label>
                    </ng-container>
                    <div *ngIf="imagePreview2" class="mt-3">
                        <img [src]="imagePreview2" alt="Image Preview" class="preview-image" />
                    </div>
                </div>
            </div>


        </div>
        <div class="flex justify-end gap-2">
            <div>
                <button class="ai-button" (click)="onSubmit()" [disabled]="formGroup.disabled">
                    {{formGroup.disabled ? "Please wait..." : (formGroup.value.id ? "Update" : "Save") }}
                </button>
            </div>
            <!-- <div>
                <button class="ai-button">Cancel</button>
            </div> -->
        </div>
    </form>
</div>
